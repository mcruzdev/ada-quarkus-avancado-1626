quarkus.application.name=wallet-api

quarkus.profile=hom,dev

%dev.app.env=dev dev dev

app.env=default

quarkus.http.port=8081

# add variable name to log pattern
quarkus.log.console.format=%X{path} %d{HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n

%dev.quarkus.log.console.json=false

mp.messaging.incoming.finished-lesson-wallet-api.connector=smallrye-kafka
mp.messaging.incoming.finished-lesson-wallet-api.topic=manual-finished-lessons

mp.messaging.incoming.finished-lesson-wallet-api.group.id=wallet-api-group